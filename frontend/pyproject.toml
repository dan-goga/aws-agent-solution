[project]
name = "agent-frontend"
version = "0.1.0"
description = "Streamlit UI for the AWS POC agent"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.39",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_frontend"]
