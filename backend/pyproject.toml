[project]
name = "agent-backend"
version = "0.1.0"
description = "FastAPI + LangChain agent backend for the AWS POC"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langfuse>=2.50",
    "boto3>=1.35",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_backend"]
